<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ScanPad</title>
<style>
  :root { color-scheme: dark; --bg: #0c0c0e; --panel: #17171b; --line: #2c2c33; --text: #e8e8ea; --dim: #8a8a94; --lcd: #ffb02e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.3 system-ui, -apple-system, sans-serif; -webkit-user-select: none; user-select: none; }
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; gap: 12px; max-width: 1400px; margin: 0 auto;
    padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  h1 { font-size: 18px; letter-spacing: .08em; margin: 0 8px 0 0; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font: inherit; cursor: pointer; }
  button.on { background: #3a2a0a; border-color: var(--lcd); color: var(--lcd); }
  .spacer { flex: 1; }
  #lcd { background: #000; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font: 600 20px/1.3 ui-monospace, Menlo, Consolas, monospace; color: var(--lcd); min-height: 56px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  #lcd small { display: block; color: var(--dim); font-size: 12px; font-weight: 400; }
  #banks { display: flex; gap: 8px; }
  #banks button { flex: 1; font-weight: 700; letter-spacing: .1em; }
  /* The pads take whatever room is left on screen, on any device: square when
     the space is tall, up to 1.6:1 when it is wide, and never past its edges. */
  #padArea { flex: 1; min-height: 0; container-type: size; }
  #grid { --g: 10px; --w: calc((100cqw - 3 * var(--g)) / 4); --h: calc((100cqh - 3 * var(--g)) / 4);
    display: grid; gap: var(--g); justify-content: center;
    grid-template-columns: repeat(4, min(var(--w), var(--h) * 1.6)); grid-template-rows: repeat(4, min(var(--h), var(--w))); }
  .pad { position: relative; container-type: size; min-width: 0; min-height: 0; overflow: hidden; border-radius: 12px; border: 2px solid color-mix(in srgb, var(--c) 55%, #000); background: linear-gradient(160deg, color-mix(in srgb, var(--c) 32%, #111), color-mix(in srgb, var(--c) 14%, #0a0a0a)); color: var(--text); display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; padding: 10px; text-align: left; transition: transform .06s, box-shadow .15s; touch-action: manipulation; }
  .pad:active { transform: scale(.96); }
  .pad.empty { --c: #333; opacity: .45; }
  .pad.live { box-shadow: 0 0 0 2px var(--c), 0 0 24px color-mix(in srgb, var(--c) 70%, transparent); background: linear-gradient(160deg, color-mix(in srgb, var(--c) 70%, #111), color-mix(in srgb, var(--c) 35%, #0a0a0a)); }
  /* Pad text scales with the pad (cqmin = 1% of its shorter side). */
  .pad .name { font-weight: 700; font-size: clamp(11px, 12cqmin, 26px); line-height: 1.15; overflow-wrap: break-word; }
  .pad .freq { font: clamp(10px, 9.5cqmin, 20px) ui-monospace, Menlo, Consolas, monospace; color: color-mix(in srgb, var(--text) 75%, transparent); margin-top: 2px; }
  .pad .tag { font: clamp(9px, 8cqmin, 17px) ui-monospace, Menlo, Consolas, monospace; color: color-mix(in srgb, var(--text) 55%, transparent); margin-top: 1px; }
  .pad .key { position: absolute; top: 6%; right: 8%; font: clamp(9px, 7cqmin, 15px) ui-monospace, monospace; color: var(--dim); }
  body.editing .pad { outline: 1px dashed var(--dim); outline-offset: -6px; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 16px; width: min(360px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog label { display: block; color: var(--dim); font-size: 12px; margin: 10px 0 4px; }
  dialog input[type=text] { width: 100%; background: #000; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: 16px ui-monospace, monospace; }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
  .swatches button { width: 30px; height: 30px; padding: 0; border-radius: 50%; background: var(--c); }
  .swatches button.on { outline: 2px solid #fff; outline-offset: 2px; }
  .actions { display: flex; gap: 8px; margin-top: 16px; }
  .seg { display: flex; gap: 0; margin-top: 4px; }
  .seg button { flex: 1; border-radius: 0; }
  .seg button:first-child { border-radius: 8px 0 0 8px; }
  .seg button:last-child { border-radius: 0 8px 8px 0; }
  .hint { color: var(--dim); font-size: 12px; margin-top: 6px; }
  /* A short, wide screen (a phone on its side): controls move to a left
     column so the pads get the full height. */
  @media (orientation: landscape) and (max-height: 600px) {
    body { max-width: none; display: grid; grid-template-columns: minmax(190px, 26%) 1fr; grid-template-rows: auto auto 1fr; gap: 8px 12px;
      padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: max(8px, env(safe-area-inset-bottom)); }
    header, #lcd, #banks { grid-column: 1; }
    header { gap: 6px; }
    header button { padding: 6px 9px; }
    h1 { width: 100%; }
    #lcd { font-size: 15px; min-height: 0; flex-direction: column; align-items: flex-start; gap: 2px; }
    #banks { flex-direction: column; align-self: start; }
    #padArea { grid-column: 2; grid-row: 1 / span 3; }
    #grid { --g: 8px; }
    .pad { padding: 6px 8px; }
  }
  /* Big screens (1080p and up): roomier controls. */
  @media (min-width: 1200px) and (min-height: 900px) {
    body { font-size: 18px; gap: 16px; }
    h1 { font-size: 24px; }
    #lcd { font-size: 26px; min-height: 72px; }
    #grid { --g: 14px; }
  }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #3a1010; border: 1px solid #a33; padding: 8px 14px; border-radius: 8px; display: none; }
</style>
</head>
<body>
<header>
  <h1>SCANPAD</h1>
  <button id="connect">Connect</button>
  <span id="status" style="color:var(--dim)">Not connected</span>
  <button id="scan">▶ Scan</button>
  <span class="spacer"></span>
  <button id="edit">Edit</button>
  <button id="export">Export</button>
  <button id="import">Import</button>
  <button id="defaults">Defaults</button>
  <input id="file" type="file" accept=".json,application/json" hidden>
</header>

<div id="lcd"><div><span id="lcdName">—</span><small id="lcdSub">Connect to the SDS150</small></div><div id="lcdFreq"></div></div>
<div id="banks"></div>
<div id="padArea"><div id="grid"></div></div>

<dialog id="dlg">
  <form method="dialog">
    <label>Name</label>
    <input type="text" id="fName" maxlength="24" placeholder="e.g. NYPD Citywide 3">
    <label>Pad tunes to</label>
    <div class="seg">
      <button type="button" id="kindFreq">A frequency</button>
      <button type="button" id="kindTag">A tagged channel</button>
    </div>
    <div id="freqBox">
      <label id="mhzLabel">Frequency (MHz)</label>
      <input type="text" id="fMhz" inputmode="decimal" placeholder="e.g. 470.8625">
    </div>
    <div id="tagBox">
      <label>Number tag (list.system.channel)</label>
      <input type="text" id="fTag" inputmode="decimal" placeholder="e.g. 1.1.3">
      <div class="actions" style="margin-top:8px"><button type="button" id="useNow">Use what's on now</button></div>
      <div class="hint">Number tags are set in Sentinel. The radio shows the current channel's tag as "Tag:".</div>
    </div>
    <label>Color</label>
    <div class="swatches" id="swatches"></div>
    <div class="actions">
      <button value="save" id="save">Save</button>
      <button value="clear" id="clear">Clear pad</button>
      <span class="spacer"></span>
      <button value="cancel" formnovalidate>Cancel</button>
    </div>
  </form>
</dialog>
<div id="toast"></div>

<script type="module">
// Bump ?v= whenever sds150.js changes: browsers (Bluefy especially) keep the
// old module for up to 10 minutes otherwise, and pair it with the new page.
import { SDS150, mhzToSteps, parseScreen, parseTag } from './sds150.js?v=5';

const BANKS = ['A', 'B', 'C', 'D'];
const COLORS = ['#ff5a36', '#ffb02e', '#ffe04a', '#5ad16b', '#2ec4b6', '#3a8dff', '#9b6bff', '#ff5ab4', '#c8c8c8'];
// Keyboard layout mirrors the 4x4 grid, drum-machine style.
const KEYS = ['1', '2', '3', '4', 'q', 'w', 'e', 'r', 'a', 's', 'd', 'f', 'z', 'x', 'c', 'v'];
const STORE = 'scanpad.v1';

const $ = id => document.getElementById(id);
let state = load();
let editing = false;
let editIndex = -1;
let pickedColor = COLORS[0];
// A pad either tunes a frequency (QSH) or jumps to a programmed channel by number tag (JNT).
let editKind = 'freq';
let screen = null;     // what the radio last showed: { mhz, name, tag }
let liveSteps = null;
let pollTimer = null;

// Saved pads, or empty banks until the default set (pads/default.json) arrives.
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE));
    if (s && s.banks) return s;
  } catch {}
  return { bank: 'A', banks: Object.fromEntries(BANKS.map(b => [b, Array(16).fill(null)])), fresh: true };
}
function usePads(s) {
  if (!s.banks || !BANKS.every(b => Array.isArray(s.banks[b]))) throw new Error('not a ScanPad file');
  state = { bank: BANKS.includes(s.bank) ? s.bank : 'A', banks: s.banks };
  save(); renderBanks(); renderGrid();
}
async function loadDefaults() {
  const r = await fetch('pads/default.json', { cache: 'no-cache' });
  if (!r.ok) throw new Error(`couldn't fetch the default pads (${r.status})`);
  usePads(await r.json());
}
function save() {
  try { localStorage.setItem(STORE, JSON.stringify(state)); } catch {}
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(toast.t);
  toast.t = setTimeout(() => (t.style.display = 'none'), 3500);
}

const radio = new SDS150({
  onState(s) {
    const label = { choosing: 'Choosing…', connecting: 'Connecting…', reconnecting: 'Link dropped, reconnecting…', connected: 'Connected', disconnected: 'Disconnected' }[s];
    $('status').textContent = label;
    $('connect').textContent = s === 'connected' || s === 'reconnecting' ? 'Disconnect' : 'Connect';
    clearInterval(pollTimer);
    if (s === 'connected') {
      // Reading the screen every 1.5 s shows what the radio is on and keeps the link busy.
      const poll = () => radio.send('GST').catch(() => {});
      poll();
      pollTimer = setInterval(poll, 1500);
    } else if (s === 'disconnected') {
      liveSteps = null;
      $('lcdName').textContent = '—';
      $('lcdSub').textContent = 'Disconnected';
      $('lcdFreq').textContent = '';
      renderGrid();
    }
  },
  onLine(line) {
    if (/^QSH,(NG|ERR)/.test(line)) toast(`Radio rejected that frequency (${line})`);
    if (/^JPM,(NG|ERR)/.test(line)) toast(`Radio wouldn't go back to scan (${line})`);
    const scr = parseScreen(line);
    if (!scr) return;
    screen = scr;
    liveSteps = scr.mhz ? mhzToSteps(scr.mhz) : null;
    $('lcdName').textContent = scr.name || '—';
    $('lcdSub').textContent = scr.tag ? `Now on · tag ${scr.tag}` : 'Now on';
    $('lcdFreq').textContent = scr.mhz ? `${parseFloat(scr.mhz).toFixed(4)} MHz` : '';
    renderGrid();
  },
});

$('connect').onclick = async () => {
  if (radio.connected || $('connect').textContent === 'Disconnect') return radio.disconnect();
  try { await radio.connect(); }
  catch (e) {
    $('status').textContent = 'Not connected';
    // Keep the reason on screen (in the display strip) so it can be read off an iPad.
    if (e.name !== 'NotFoundError') { $('lcdName').textContent = 'Connect failed'; $('lcdSub').textContent = e.message || String(e); }
  }
};

$('scan').onclick = async () => {
  if (!radio.connected) return toast('Connect to the SDS150 first');
  try { await radio.resumeScan(); } catch (e) { toast(`Send failed: ${e.message || e}`); }
};

function renderBanks() {
  $('banks').replaceChildren(...BANKS.map(b => {
    const btn = document.createElement('button');
    btn.textContent = `BANK ${b}`;
    btn.className = b === state.bank ? 'on' : '';
    btn.onclick = () => { state.bank = b; save(); renderBanks(); renderGrid(); };
    return btn;
  }));
}

function renderGrid() {
  const pads = state.banks[state.bank];
  $('grid').replaceChildren(...pads.map((p, i) => {
    const el = document.createElement('button');
    el.className = 'pad' + (p ? '' : ' empty') + (p && isLive(p) ? ' live' : '');
    if (p) el.style.setProperty('--c', p.color);
    el.innerHTML = `<span class="key"></span><span class="name"></span><span class="freq"></span><span class="tag"></span>`;
    el.querySelector('.key').textContent = KEYS[i].toUpperCase();
    el.querySelector('.name').textContent = p ? p.name : (editing ? '+ add' : '');
    el.querySelector('.freq').textContent = p && p.mhz ? [fmtMhz(p.mhz), p.mode].filter(Boolean).join(' ') : '';
    el.querySelector('.tag').textContent = p && p.kind === 'tag' ? `★ ${p.tag}` : '';
    el.onclick = () => press(i);
    return el;
  }));
}

// A pad is live when the radio shows its tag or its frequency.
function isLive(p) {
  if (p.kind === 'tag' && screen && screen.tag === p.tag) return true;
  return !!p.mhz && liveSteps !== null && liveSteps === mhzToSteps(p.mhz);
}

// 123.9 -> "123.900", 462.5625 -> "462.5625".
function fmtMhz(mhz) {
  return parseFloat(mhz).toFixed(4).replace(/0$/, '');
}

async function press(i) {
  const p = state.banks[state.bank][i];
  if (editing || !p) return openEditor(i);
  if (!radio.connected) return toast('Connect to the SDS150 first');
  try {
    if (p.kind === 'tag') {
      // Someone else's radio won't have these tags; a tag pad that knows its
      // frequency still works there, it just tunes instead of jumping.
      try { await radio.jumpTag(p.tag); }
      catch (e) { if (!p.mhz || !/has tag/.test(e.message)) throw e; await radio.tune(p.mhz); liveSteps = mhzToSteps(p.mhz); }
    } else { await radio.tune(p.mhz); liveSteps = mhzToSteps(p.mhz); }
    renderGrid();
  } catch (e) { toast(e.message || String(e)); }
}

function openEditor(i) {
  editIndex = i;
  const p = state.banks[state.bank][i];
  $('fName').value = p ? p.name : '';
  $('fMhz').value = p && p.mhz ? fmtMhz(p.mhz) : '';
  $('fTag').value = p && p.kind === 'tag' ? p.tag : '';
  setKind(p && p.kind === 'tag' ? 'tag' : 'freq');
  pickedColor = p ? p.color : COLORS[i % COLORS.length];
  renderSwatches();
  $('clear').style.display = p ? '' : 'none';
  $('dlg').showModal();
  $('fName').focus();
}

function setKind(k) {
  editKind = k;
  $('kindFreq').className = k === 'freq' ? 'on' : '';
  $('kindTag').className = k === 'tag' ? 'on' : '';
  $('mhzLabel').textContent = k === 'freq' ? 'Frequency (MHz)' : 'Frequency (MHz, optional: tuned if the radio has no such tag)';
  $('tagBox').style.display = k === 'tag' ? '' : 'none';
}
$('kindFreq').onclick = () => setKind('freq');
$('kindTag').onclick = () => setKind('tag');

// Fill the pad from whatever channel the radio is on right now.
$('useNow').onclick = () => {
  if (!radio.connected) return toast('Connect to the SDS150 first');
  if (!screen) return toast('Still reading the radio; try again in a second');
  if (!screen.tag) return toast(`"${screen.name || 'This channel'}" has no number tag. Give it one in Sentinel.`);
  $('fTag').value = screen.tag;
  if (!$('fName').value.trim()) $('fName').value = screen.name.slice(0, 24);
};

function renderSwatches() {
  $('swatches').replaceChildren(...COLORS.map(c => {
    const b = document.createElement('button');
    b.type = 'button';
    b.style.setProperty('--c', c);
    b.className = c === pickedColor ? 'on' : '';
    b.onclick = () => { pickedColor = c; renderSwatches(); };
    return b;
  }));
}

$('dlg').querySelector('form').addEventListener('submit', e => {
  e.preventDefault();
  const pads = state.banks[state.bank];
  const v = e.submitter ? e.submitter.value : 'save';
  const old = pads[editIndex];
  if (v === 'clear') pads[editIndex] = null;
  if (v === 'save') {
    const raw = $('fMhz').value.trim();
    const n = parseFloat(raw);
    if ((editKind === 'freq' || raw) && !(n >= 25 && n <= 1300)) { toast('Frequency must be between 25 and 1300 MHz'); return; }
    const mhz = raw ? n.toFixed(4) : undefined;
    // The mode is display-only (the radio picks it); keep it while the frequency is unchanged.
    const mode = old && old.mode && old.mhz === mhz ? old.mode : undefined;
    if (editKind === 'tag') {
      let t;
      try { t = parseTag($('fTag').value); } catch (err) { toast(err.message); return; }
      const tag = `${t.fl}.${t.sys}.${t.chan}`;
      pads[editIndex] = { kind: 'tag', name: $('fName').value.trim() || `Tag ${tag}`, tag, mhz, mode, color: pickedColor };
    } else {
      pads[editIndex] = { name: $('fName').value.trim() || fmtMhz(mhz), mhz, mode, color: pickedColor };
    }
  }
  $('dlg').close();
  save();
  renderGrid();
});

$('edit').onclick = () => {
  editing = !editing;
  document.body.classList.toggle('editing', editing);
  $('edit').classList.toggle('on', editing);
  $('edit').textContent = editing ? 'Done' : 'Edit';
  renderGrid();
};

$('export').onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'scanpad.json';
  a.click();
  URL.revokeObjectURL(a.href);
};
$('import').onclick = () => $('file').click();
$('file').onchange = async () => {
  const f = $('file').files[0];
  if (!f) return;
  try { usePads(JSON.parse(await f.text())); }
  catch (e) { toast(`Import failed: ${e.message}`); }
  $('file').value = '';
};
$('defaults').onclick = () => {
  if (confirm('Replace all your pads with the default set? Export first if you want to keep them.'))
    loadDefaults().catch(e => toast(e.message));
};

document.addEventListener('keydown', e => {
  if ($('dlg').open || e.ctrlKey || e.metaKey || e.altKey) return;
  const i = KEYS.indexOf(e.key.toLowerCase());
  if (i >= 0) { e.preventDefault(); press(i); }
  else if (e.key === ' ') { e.preventDefault(); $('scan').click(); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    const d = e.key === 'ArrowLeft' ? -1 : 1;
    state.bank = BANKS[(BANKS.indexOf(state.bank) + d + BANKS.length) % BANKS.length];
    save(); renderBanks(); renderGrid();
  }
});

renderBanks();
renderGrid();
if (state.fresh) loadDefaults().catch(e => toast(e.message));
</script>
</body>
</html>
